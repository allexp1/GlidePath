name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The engine. No simulator, no Xcode project, no network: this is the job
  # that should stay green in seconds and is the one to look at first when
  # something breaks.
  core-engine:
    name: Core engine tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version
          swift --version

      - name: Run tests
        working-directory: ios/Packages/GlidePathCore
        run: swift test --enable-code-coverage

      - name: Check the GPX fixture is up to date
        run: |
          node scripts/generate-test-gpx.mjs
          if ! git diff --quiet -- ios/Packages/GlidePathCore/Tests/GlidePathCoreTests/Fixtures; then
            echo "::error::The GPX fixture is out of sync with scripts/generate-test-gpx.mjs."
            git --no-pager diff --stat -- ios/Packages/GlidePathCore/Tests/GlidePathCoreTests/Fixtures
            exit 1
          fi

  # The app. Needs the generated Xcode project, so it also proves the XcodeGen
  # manifest still works from a clean checkout.
  app:
    name: App build and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Config.xcconfig is gitignored because it holds real keys. CI builds
      # against the example, which is exactly what a developer sees before they
      # have filled anything in - so this job also proves a fresh clone builds.
      - name: Create a placeholder configuration
        run: cp Config.example.xcconfig Config.xcconfig

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick an available simulator
        id: simulator
        run: |
          device=$(xcrun simctl list devices available --json \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device['name']:
                      best = device['udid']
          print(best or '')
          ")
          if [ -z "$device" ]; then
            echo "::error::No iOS simulator available on this runner"
            exit 1
          fi
          echo "udid=$device" >> "$GITHUB_OUTPUT"
          echo "Using simulator $device"

      - name: Build and test
        run: |
          xcodebuild test \
            -project ios/GlidePath.xcodeproj \
            -scheme GlidePath \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=""

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install swiftlint
      - run: swiftlint lint --strict --reporter github-actions-logging

  # The Edge Function and the seed CLI share their code, so type-checking one
  # type-checks both.
  supabase-functions:
    name: Edge function and seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Checked separately, from different directories, because Deno discovers
      # deno.json from the working directory rather than from the file it is
      # given. The seed CLI has its own config and must be checked from inside
      # supabase/seed, or its mapped imports read as missing dependencies. The
      # Edge Function has no config and uses explicit npm:/jsr: specifiers, so
      # it checks fine from anywhere - which is the point, since Supabase's
      # runtime resolves it the same way.
      - name: Type check the Edge Function
        run: deno check supabase/functions/sync-cameras/index.ts

      - name: Type check the seed CLI
        working-directory: supabase/seed
        run: deno check seed.ts inspect.ts seed_limits.ts

      # Lint is syntactic and resolves no imports, so one pass from the root
      # covers both.
      - name: Lint
        run: deno lint supabase/functions supabase/seed

      # The translation layer decides what the app claims about a camera and how
      # long a section is, off tagging that is a convention rather than a schema.
      # It went untested until a real country turned out to use a member role the
      # code did not accept.
      - name: Test the shared sync modules
        run: deno test supabase/functions/_shared

      # Type checking is not loading. `deno check` resolves npm specifiers
      # through the global cache and passes, while `deno run` can still fail on
      # a real machine because something upstream put Deno into node-resolution
      # mode. This runs the CLI for real, with no credentials, and expects it to
      # bail out cleanly on the missing keys - which it can only do if every
      # module in the graph actually loaded first.
      - name: The seed CLI must actually run
        working-directory: supabase/seed
        run: |
          set +e
          output=$(deno run --allow-net --allow-env --allow-read seed.ts moldova 2>&1)
          status=$?
          set -e
          echo "$output"

          if [ "$status" -ne 1 ]; then
            echo "::error::expected exit 1 with no credentials, got $status"
            exit 1
          fi
          if ! echo "$output" | grep -q "SUPABASE_URL"; then
            echo "::error::expected a complaint about missing credentials, got something else"
            exit 1
          fi
          echo "Seed CLI loads and fails for the right reason."

      # A copied .env.example is a syntactically valid config pointing at a host
      # that does not exist. Presence checks pass, Overpass runs for two minutes,
      # and it dies on DNS. The seed has to reject the placeholder up front.
      - name: The seed CLI must reject placeholder credentials
        working-directory: supabase/seed
        env:
          SUPABASE_URL: https://your-project-ref.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: YOUR-SERVICE-ROLE-KEY
        run: |
          set +e
          output=$(deno run --allow-net --allow-env --allow-read seed.ts moldova 2>&1)
          status=$?
          set -e
          echo "$output"

          if [ "$status" -ne 1 ]; then
            echo "::error::expected exit 1 on placeholder credentials, got $status"
            exit 1
          fi
          if ! echo "$output" | grep -q "placeholder"; then
            echo "::error::expected the placeholder to be named as the problem"
            exit 1
          fi
          if echo "$output" | grep -qi "querying Overpass"; then
            echo "::error::it started querying Overpass before validating credentials"
            exit 1
          fi
          echo "Seed CLI refuses placeholder credentials before doing any work."

      - name: Validate the seed data files
        run: |
          for file in supabase/seed/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" \
              || { echo "::error file=$file::invalid JSON"; exit 1; }
            echo "ok $file"
          done

  # Applies every migration to a real Postgres with the real extensions. This
  # is the only place the SQL is actually executed, so it is the job that
  # catches a typo in a constraint or a function that does not compile.
  database:
    name: Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start`, not `supabase db start`. The latter brings up Postgres
      # alone, which is enough to prove the SQL is valid but leaves nothing
      # listening on the API port - so the PostgREST check below was connecting
      # to a closed socket and dying on curl's exit 7 before it printed a word.
      - name: Start the local stack and apply migrations
        run: supabase start

      - name: Re-apply from scratch
        run: supabase db reset

      - name: Confirm the schema landed
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c "
            select count(*) as camera_type_values from pg_enum
             where enumtypid = 'public.camera_type'::regtype;
          "
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c "
            select count(*) as countries,
                   count(*) filter (where sync_enabled) as syncing
              from public.countries;
          "
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c "
            select code, name, dataset_version from public.countries
             where sync_enabled order by code;
          "
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c "
            select table_name from information_schema.views
             where table_schema = 'public' order by table_name;
          "

      # The catalogue is generated from ICU, which carries withdrawn codes as
      # well as live ones and resolves several of them onto the name of whatever
      # replaced them: RH and ZW both come back as 'Zimbabwe'. That is two rows
      # for one place, one of which can never have data, and in the app it reads
      # as a bug rather than as a quirk of a standard.
      - name: The country catalogue must be complete and unambiguous
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              total int;
              dupes text;
            begin
              select count(*) into total from public.countries;
              if total < 240 then
                raise exception 'only % countries in the catalogue, expected the full list', total;
              end if;

              select string_agg(name || ' (' || codes || ')', ', ') into dupes
                from (
                  select name, string_agg(code, '/' order by code) as codes
                    from public.countries
                   group by name
                  having count(*) > 1
                ) clashes;

              if dupes is not null then
                raise exception 'duplicate country names: %', dupes;
              end if;
            end
            \$\$;
          "
          echo "Catalogue is complete and every country name is unique."

      # Applying the schema proves the SQL is valid. It does not prove the app's
      # queries work against it. The client pages with
      # `order=updated_at.asc,<unique>.asc`, and naming a column a view does not
      # have is a PostgREST 400 that only shows up at runtime - which is exactly
      # how `countries_public.id does not exist` reached a phone.
      - name: The app's own queries must work against the views
        run: |
          ANON=$(supabase status -o json 2>/dev/null \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('ANON_KEY',''))" 2>/dev/null || true)
          if [ -z "$ANON" ]; then
            # The CLI's local demo key, stable across versions.
            ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6MTk1NzM0NTIwMH0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE"
          fi

          base="http://127.0.0.1:54321/rest/v1"

          # Kong answers after the containers report healthy, not with them, so
          # without this the first check races the gateway coming up. Any HTTP
          # response counts as up, deliberately - what the status code should be
          # is what the checks below are for.
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null -H "apikey: $ANON" "$base/countries_public?limit=1"; then
              echo "The API gateway is answering after ${attempt}s."
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "::error::nothing answering on $base after 30s"
              supabase status || true
              exit 1
            fi
            sleep 1
          done

          failed=0

          # curl's own exit code is captured rather than left to kill the step:
          # the job runs under `set -e`, so a bare connection failure inside a
          # command substitution ends the script before a single line is printed.
          # That is precisely how this step failed silently with exit 7.
          check() {
            view=$1
            unique=$2
            status=$(curl -s -o /tmp/rest.json -w '%{http_code}' \
              -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
              "$base/$view?select=*&order=updated_at.asc,$unique.asc&limit=1000&offset=0") || {
              echo "::error::could not reach $base/$view (curl exit $?)"
              failed=1
              return
            }
            if [ "$status" != "200" ]; then
              echo "::error::$view ordered by $unique returned HTTP $status: $(cat /tmp/rest.json)"
              failed=1
            else
              echo "ok   $view (order by updated_at, $unique)"
            fi
          }

          # These pairs must match the fetchAll and fetchPage calls in
          # CountrySyncService.
          check countries_public code
          check cameras_public id
          check zones_public id
          check rest_stops_public id
          check road_limits_public id

          exit $failed

      # An empty Overpass response used to mean "every camera here is gone", and
      # the app fades an unverified camera. Two runs against Lithuania minutes
      # apart returned 0 and then 578 nodes for the same query, so this is a real
      # night rather than a hypothetical one.
      - name: A failed harvest must not unverify a whole country
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              v_faded int;
              v_error text;
              v_run timestamptz := now();
            begin
              -- Twelve cameras, all last seen before the run: exactly what an
              -- empty harvest looks like to finish_country_sync.
              insert into public.cameras (country_code, location, type, osm_id, source, verified, last_seen_at)
              select 'IL',
                     extensions.st_setsrid(extensions.st_makepoint(34.8 + i * 0.001, 32.1), 4326),
                     'fixed',
                     'test/harvest/' || i,
                     'osm',
                     true,
                     v_run - interval '1 day'
                from generate_series(1, 12) as i;

              perform public.finish_country_sync('IL', v_run, null);

              select count(*) into v_faded
                from public.cameras
               where osm_id like 'test/harvest/%' and not verified;

              if v_faded > 0 then
                raise exception 'a wholly empty harvest unverified % of 12 cameras', v_faded;
              end if;

              select last_sync_error into v_error from public.countries where code = 'IL';
              if v_error is null or v_error not like '%refused%' then
                raise exception 'the refusal was not recorded against the country: %', coalesce(v_error, 'null');
              end if;

              -- One camera going missing is an ordinary mapping change and must
              -- still be acted on.
              update public.cameras set last_seen_at = v_run
               where osm_id like 'test/harvest/%' and osm_id <> 'test/harvest/1';

              perform public.finish_country_sync('IL', v_run, null);

              select count(*) into v_faded
                from public.cameras
               where osm_id like 'test/harvest/%' and not verified;

              if v_faded <> 1 then
                raise exception 'expected exactly the one missing camera to fade, got %', v_faded;
              end if;

              delete from public.cameras where osm_id like 'test/harvest/%';
            end
            \$\$;
          "
          echo "A wholly empty harvest is refused; a single removal still lands."

      # A road-limit harvest is a few hundred tiled Overpass queries and stopping
      # after 200 of them is an ordinary outcome. Every way in the tiles that
      # were never fetched looks exactly like a way that has been deleted, so a
      # partial run must not be allowed to retire anything.
      - name: A partial limit harvest must not retire the tiles it never fetched
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare
              v_faded int;
              v_error text;
              v_run timestamptz := now();
            begin
              -- Two hundred limits, all last seen before this run: what the
              -- unfetched half of a country looks like to the finish function.
              insert into public.road_limits
                (country_code, highway, polyline, limit_kph, osm_id, source, verified, last_seen_at)
              select 'IL',
                     'primary',
                     extensions.st_setsrid(
                       extensions.st_makeline(
                         extensions.st_makepoint(34.8 + i * 0.001, 32.1),
                         extensions.st_makepoint(34.8 + i * 0.001, 32.11)
                       ), 4326),
                     90,
                     'test/limits/' || i,
                     'osm',
                     true,
                     v_run - interval '1 day'
                from generate_series(1, 200) as i;

              -- p_complete false: the run knows it did not cover the country.
              perform public.finish_road_limit_sync('IL', v_run, false, null);

              select count(*) into v_faded
                from public.road_limits where osm_id like 'test/limits/%' and not verified;
              if v_faded > 0 then
                raise exception 'a partial harvest retired % limits', v_faded;
              end if;

              select road_limits_sync_error into v_error from public.countries where code = 'IL';
              if v_error is null or v_error not like '%partial%' then
                raise exception 'the partial run was not recorded: %', coalesce(v_error, 'null');
              end if;

              -- A complete run that saw nothing is still a failed harvest, and
              -- the more-than-half guard is what catches it.
              perform public.finish_road_limit_sync('IL', v_run, true, null);

              select count(*) into v_faded
                from public.road_limits where osm_id like 'test/limits/%' and not verified;
              if v_faded > 0 then
                raise exception 'a wholly empty complete harvest retired % limits', v_faded;
              end if;

              -- One road losing its maxspeed tag is an ordinary mapping change
              -- and must still be acted on.
              update public.road_limits set last_seen_at = v_run
               where osm_id like 'test/limits/%' and osm_id <> 'test/limits/1';

              perform public.finish_road_limit_sync('IL', v_run, true, null);

              select count(*) into v_faded
                from public.road_limits where osm_id like 'test/limits/%' and not verified;
              if v_faded <> 1 then
                raise exception 'expected exactly the one retagged road to retire, got %', v_faded;
              end if;

              delete from public.road_limits where osm_id like 'test/limits/%';
              update public.countries
                 set road_limit_count = 0, road_limits_sync_error = null where code = 'IL';
            end
            \$\$;
          "
          echo "Partial and empty limit harvests retire nothing; a single removal still lands."

      - name: Every public table must have row level security on
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -t -c "
            select string_agg(tablename, ', ')
              from pg_tables
             where schemaname = 'public'
               and not rowsecurity;
          " > /tmp/unprotected.txt
          if [ -s /tmp/unprotected.txt ] && grep -q '[^[:space:]]' /tmp/unprotected.txt; then
            echo "::error::Tables without row level security: $(cat /tmp/unprotected.txt)"
            exit 1
          fi
          echo "All public tables have row level security enabled."
