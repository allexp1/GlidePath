included:
  - ios/App/Sources
  - ios/Packages/GlidePathCore/Sources
  - ios/Packages/GlidePathCore/Tests

excluded:
  - ios/Packages/GlidePathCore/.build
  - .build

disabled_rules:
  - todo
  - trailing_comma

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 800

type_body_length:
  warning: 350
  error: 500

function_body_length:
  warning: 70
  error: 120

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded:
    - id
    - dx
    - dy
    - t
    - v
    - s

type_name:
  min_length: 3
  max_length:
    warning: 45
    error: 60

nesting:
  type_level: 2

force_cast: error
force_try: error
force_unwrapping: error

reporter: "xcode"
